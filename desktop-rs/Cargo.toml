[package]
name = "ielts-vocabulary"
version = "1.0.0"
edition = "2021"

[dependencies]
wry = "0.57"
tao = "0.37"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
