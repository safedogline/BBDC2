<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141722">
  <title>IELTS 词汇</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-theme="deep">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <a class="brand" href="#home" aria-label="首页"><span class="brand-mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 3v18"/></svg></span></a>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="收起侧栏">☰</button>
      </div>
      <div class="side-label">学习</div>
      <nav class="navigation" aria-label="主导航">
        <button data-label="今日学习" class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span class="nav-label">今日学习</span></button>
        <button data-label="复习队列" class="nav-item" data-view="review"><span class="nav-icon">↻</span><span class="nav-label">复习队列</span><span class="nav-count" id="review-nav-count">0</span></button>
        <button data-label="随身听" class="nav-item" data-view="listen"><span class="nav-icon">♫</span><span class="nav-label">随身听</span></button>
        <button data-label="听力" class="nav-item" data-view="listening"><span class="nav-icon">♪</span><span class="nav-label">听力</span></button>
        <button data-label="词典" class="nav-item" data-view="dict"><span class="nav-icon">⌕</span><span class="nav-label">词典</span></button>
      </nav>
      <div class="side-label">词库</div>
      <nav class="navigation" aria-label="词库导航">
        <button data-label="词书浏览" class="nav-item" data-view="words"><span class="nav-icon">▦</span><span class="nav-label">词书浏览</span></button>
        <button data-label="例句库" class="nav-item" data-view="sentences"><span class="nav-icon">¶</span><span class="nav-label">例句库</span></button>
        <button data-label="资料" class="nav-item" data-view="materials"><span class="nav-icon">▤</span><span class="nav-label">资料</span></button>
      </nav>
      <div class="side-label library-label">我的词书</div>
      <div id="book-list" class="book-list"></div>
      <button class="add-book" id="import-button"><span>＋</span>导入词书</button>
      <input id="file-input" type="file" accept=".csv,.tsv,.json,text/csv,application/json" hidden>
      <div class="side-label library-label">更多</div>
      <nav class="navigation" aria-label="更多导航">
        <button data-label="学习偏好" class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span class="nav-label">学习偏好</span></button>
        <button data-label="外观" class="nav-item" data-view="appearance"><span class="nav-icon">◐</span><span class="nav-label">外观</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span><span>仅保存在此设备</span></div>
    </aside>

    <main class="main-area">
      <section id="view-home" class="view active-view"></section>
      <section id="view-review" class="view"></section>
      <section id="view-listen" class="view"></section>
      <section id="view-listening" class="view"></section>
      <section id="view-dict" class="view"></section>
      <section id="view-words" class="view"></section>
      <section id="view-sentences" class="view"></section>
      <section id="view-materials" class="view"></section>
      <section id="view-settings" class="view"></section>
      <section id="view-appearance" class="view"></section>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="help-dialog">
    <form method="dialog" class="dialog-content">
      <div class="dialog-header"><h2>导入词书</h2><button class="icon-button" aria-label="关闭">×</button></div>
      <p>支持 UTF-8 编码的 CSV、TSV 或 JSON 文件。每行一个词条，字段可包含：</p>
      <div class="format-example"><code>word,meaning,example,translation,phonetic,audio</code></div>
      <p>CSV 首行可使用字段名。JSON 可为词条数组，或包含 <code>name</code> 与 <code>words</code> 的对象。音频字段填写可直接访问的 URL。</p>
      <p class="muted">词书与学习进度保存在当前浏览器的本地存储中，不会上传。</p>
      <button class="primary-button dialog-done">知道了</button>
    </form>
  </dialog>
  <script src="./app.js"></script>
</body>
</html>
